<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Username Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-dark">
    <nav class="bg-nav d-flex align-items-center justify-content-between m-2 w-75 rounded-5">
        <!--ADD ITEMS TO NAVIGATION BAR-->
    </nav> 
    <main class="w-100 h-100 d-flex flex-column align-items-center justify-content-start">
        <h1 class="mt-5">Username Generator</h1>
        <section class="w-100 h-75 d-flex flex-column align-items-center pt-4 justify-content-start">
            <div class="form-control rounded-5 px-2 d-flex align-items-center justify-content-between border-5 w-50 preview-div containerPreviewPerzonalzed" >
                <h2 class="m-1 fs-5" id="usernameResult">Your Username Display Here</h2>
                <div class="d-flex align-items-center justify-content-between btnPerzonalized">
                    <button class="btn border-success rounded-5 btn-success">Copy</button> 
                    <button id="btnGenerate" class="btn btn-primary rounded-5">Generate</button>
                </div>

            </div>

            <div class="d-flex w-50  justify-content-center conditionAndItemsPerzonalized">
                <div class="bg-light m-3 w-50 p-3 rounded-4 container-fluid containerPerzonalized ">
                    <h5 class="text-dark">Enter your conditions:</h5>
                    <div class="form-control w-100 d-flex align-items-center justify-content-between mt-3 mb-3">
                        <label for="adjective">Adjective:</label> 
                        <input type="text" id="adjective" placeholder="Example: Sky" class="w-75 rounded-2 border-1 border-dark p-1">
                    </div>
                    <div class="form-control w-100 d-flex align-items-center justify-content-between mb-3">
                        <label for="noun">Noun:</label> 
                        <input type="text" id="noun" placeholder="Example: Blue" class="w-75 rounded-2 border-1 border-dark p-1 ">
                    </div>
                    <div class="form-control w-100 d-flex align-items-center justify-content-between mb-3">
                        <label for="number">Number:</label> 
                        <input type="number" id="number" placeholder="Example: 12" class="w-75 rounded-2 border-1 border-dark p-1">
                    </div>
                    <div class="form-control w-100 d-flex align-items-center justify-content-between mb-3">
                        <label for="separator">Separator:</label> 
                        <input type="text" id="separator" placeholder="Example: _, - () ." class="w-75 rounded-2 border-1 border-dark p-1">
                    </div>
                </div>
                <div class="bg-light m-3 w-50 p-3 rounded-4 container-fluid containerPerzonalized">
                    <h5 class="text-dark">Here your usernames:</h5>
                    <ul class="text-dark" id="sugestedUsers">
                       
                    </ul>
                    
                </div>
            </div>
            
        </section>
        <!-- <footer class="bg-secondary w-75 h-25 rounded-4 container-fluid d-flex align-items-cente justify-content-center">
            ADD ITEMS TO FOOTER
        </footer> -->
    </main>
    <script src="./script.js"></script>
</body>
</html>
